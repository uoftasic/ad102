# Optional: markdown link check for docs/**
name: Docs link check

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-link-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-link-check.yml"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # lychee >=0.20: mail off by default (--exclude-mail removed)
          # %7B%7B matches URL-encoded {{COURSE_*}} placeholders still in the template
          args: >-
            --verbose
            --no-progress
            --root-dir 'docs'
            --exclude '%7B%7B'
            --exclude 'localhost'
            'docs/**/*.md'
          fail: true
