<script>
// Old Docsify links look like /ad102/#/labs/lab-03-mosfet-regions-overview?id=part-8
// Send them to the Quarto page: /ad102/labs/lab-03-mosfet-regions-overview.html#part-8
(function () {
  var h = window.location.hash;
  if (h.indexOf("#/") !== 0) return;
  var route = h.slice(2), id = "";
  var q = route.indexOf("?");
  if (q >= 0) {
    var m = route.slice(q + 1).match(/(?:^|&)id=([^&]*)/);
    if (m) id = m[1];
    route = route.slice(0, q);
  }
  route = route.replace(/\.md$/, "").replace(/\/$/, "");
  if (route === "" || route === "README") route = "index";
  var root = document.querySelector('meta[name="quarto:offset"]');
  var base = root ? root.getAttribute("content") : "./";
  window.location.replace(base + route + ".html" + (id ? "#" + id : ""));
})();
</script>
